# Activate with: --spring.profiles.active=debug

logging.file.name=${files.root.folder}/logs/console.log
logging.logback.rollingpolicy.max-file-size=10MB
# The default file pattern is date based, so this counts days. total-size-cap bounds the disk use to about 10 files.
logging.logback.rollingpolicy.max-history=1
logging.logback.rollingpolicy.total-size-cap=100MB

# Log every MCP tool call (to Jenkins and to this server) with parameters and the full response body
logging.level.mcp.calls=DEBUG
