spring.application.name=jenkins-monitoring-mcp
spring.main.banner-mode=off

# --- Local MCP server: Streamable HTTP, no authentication, localhost only ---
server.address=127.0.0.1
server.port=2026
spring.ai.mcp.server.name=jenkins-monitoring-mcp
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
# MCP clients keep a stream open for as long as they are connected; do not wait for them (default: 30 s) on shutdown
server.shutdown=immediate

# The collector and the retention cleaner must not block each other
spring.task.scheduling.pool.size=3

# --- Files ---
# Relative paths are resolved against the folder that contains the jar
files.root.folder=jenkins-monitoring-mcp
files.storage.path=${files.root.folder}/db

# Records older than this many days are deleted from jobs.json and notification_*.json
retention.policy.days=30

# --- Schedulers (Spring cron: second minute hour day month weekday) ---
scheduling.jenkins-job-check.cron=0 */5 * * * *
scheduling.retention-cleanup.cron=0 0 3 * * *
# Notification delivery is Phase 2
scheduling.notifications.cron=*/30 * * * * *

# --- Tools ---
tools.recent-jobs.default-limit=20
tools.notifications.max-results=200

# --- Collector ---
collector.max-builds-per-job-per-cycle=20
collector.max-parameter-value-length=200

# --- Jenkins access ---
jenkins.request-timeout=10s
# Read-only tools the collector is allowed to call. The four build-changing tools are never allowed.
jenkins.allowed-tools=getBuild,getJob,whoAmI,getStatus
# The tree is mandatory for getBuild: an unfiltered build response is about 190 KB
jenkins.build-tree=number,result,displayName,fullDisplayName,timestamp,duration,url,building,description,nextBuild[number,url],actions[causes[shortDescription,userId,userName],parameters[name,value],lastBuiltRevision[branch[name]]]

# Jenkins servers. Add as many as needed; put them in an application.properties next to the jar.
# 'auth' is the NAME of an environment variable whose value is: Basic <base64 of user:apiToken>
#jenkins.servers[0].url=https://jenkins-server1.com/mcp-server/mcp
#jenkins.servers[0].protocol=STREAMABLE
#jenkins.servers[0].auth=JENKINS_SERVER1_AUTH

# Parameter names matching this pattern are masked in stored records and in logs
logging.mask-parameter-pattern=(?i).*(password|token|secret|key).*
